[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.bold]
family = "monospace"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "monospace"
style = "Regular"

[[keyboard.bindings]]
action = "Paste"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "Copy"
key = "Insert"
mods = "Control"

[general]
live_config_reload = true
import = ["/home/evan/.config/alacritty/dracula.toml"]

[terminal]

[terminal.shell]
args = ["--login"]
program = "/bin/bash"

[window]
opacity = 0.8

[window.padding]
x = 0
y = 0

[colors]
draw_bold_text_with_bright_colors = true

[keyboard]
